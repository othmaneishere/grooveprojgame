<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A first-person tour of a furnished, two-storey house.">
  <title>Ashbourne House</title>
  <link rel="stylesheet" href="./house.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
  <main id="world" aria-label="Ashbourne House 3D interior"></main>
  <div class="vignette" aria-hidden="true"></div>
  <div id="reticle" hidden aria-hidden="true"></div>
  <div id="interaction" hidden><kbd>E</kbd> <span></span></div>
  <aside id="location" hidden><span id="storey"></span><h2 id="room"></h2></aside>
  <button id="pause" hidden aria-label="Pause">Ⅱ</button>
  <div id="touch" hidden aria-label="Touch controls">
    <div id="stick"></div><button id="touch-door" aria-label="Use door">Door</button>
  </div>
  <section id="menu" aria-labelledby="title">
    <div class="plate">
      <div class="ornament" aria-hidden="true">◆</div>
      <h1 id="title">Ashbourne<br>House</h1>
      <p id="status" role="status">Preparing the house…</p>
      <button id="enter" disabled>Explore the house</button>
      <div id="keys"><kbd>W A S D</kbd> Move <kbd>Mouse</kbd> Look <kbd>E</kbd> Door <kbd>Esc</kbd> Pause</div>
      <div id="links" hidden><button id="reset">Return to entrance</button><label><input id="quiet" type="checkbox"> Reduce motion</label></div>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
